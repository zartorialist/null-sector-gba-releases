# A new ROM pushed to rom/ becomes a release: the file people download is Triiv.gba
# (its link reads "Triiv.gba"), and rom/NOTES.md is the release text.
name: Release ROM
on:
  push:
    branches: [main]
    paths: ['rom/Triiv.gba']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$(date -u +%Y%m%d-%H%M)"
          gh release create "$TAG" "rom/Triiv.gba#Triiv.gba" \
            --title "Triiv ($TAG)" --notes-file rom/NOTES.md --latest
