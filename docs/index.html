<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRiiV · a free Game Boy Advance game</title>
<meta name="description" content="TRiiV: zero-G arena combat for the Game Boy Advance. Zero gravity. No brakes. Every shot drains your shield. Free ROM.">
<meta property="og:type" content="website">
<meta property="og:title" content="TRiiV · a free Game Boy Advance game">
<meta property="og:description" content="Zero gravity. No brakes. Every shot drains your shield.">
<meta property="og:url" content="https://zartorialist.github.io/triiv/">
<meta property="og:image" content="https://zartorialist.github.io/triiv/img/card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zartorialist.github.io/triiv/img/card.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Exo+2:wght@400;500;600&display=swap">
<style>
:root{
  --sky0:#07031a; --sky1:#170a38; --sky2:#3a1257;
  --panel:#1b0d36; --panel2:#24114a;
  --cyan:#4fe0ff; --pink:#ff4fb0; --hot:#ff7ad1; --lav:#b9a8ec; --dim:#7d6aa8;
  --gold:#ffd23f; --white:#fff4fb;
  --px:"Silkscreen","Courier New",monospace;
  --body:"Exo 2",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--sky0);color:var(--white)}
body{font-family:var(--body);overflow-x:hidden;min-height:100vh;position:relative}

/* ---------- synthwave backdrop: sky, stars, sliced sun, grid floor ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,var(--sky0) 0%,var(--sky1) 38%,var(--sky2) 62%,#5a1660 70%,#14062a 70.2%,#0b0420 100%)}
.stars{position:absolute;inset:0 0 32% 0;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff 98%,transparent),
    radial-gradient(1px 1px at 27% 42%,#cfe9ff 98%,transparent),
    radial-gradient(2px 2px at 41% 9%,#ffd6f1 98%,transparent),
    radial-gradient(1px 1px at 58% 31%,#fff 98%,transparent),
    radial-gradient(1.5px 1.5px at 73% 14%,#bff3ff 98%,transparent),
    radial-gradient(1px 1px at 86% 47%,#fff 98%,transparent),
    radial-gradient(1px 1px at 6% 58%,#ffd6f1 98%,transparent),
    radial-gradient(2px 2px at 93% 24%,#fff 98%,transparent),
    radial-gradient(1px 1px at 34% 64%,#fff 98%,transparent),
    radial-gradient(1px 1px at 66% 58%,#cfe9ff 98%,transparent);
  animation:none}
.stars.b{background-position:37px 61px;opacity:.6;animation-delay:-1.6s}
@keyframes twinkle{50%{opacity:.45}}
.sun{position:absolute;width:min(46vw,520px);aspect-ratio:1;right:6vw;top:70%;transform:translateY(-62%);border-radius:50%;
  background:linear-gradient(180deg,#ffe36b 0%,#ffa04f 40%,#ff4fa0 75%,#c42c8c 100%);
  -webkit-mask:linear-gradient(180deg,#000 0 48%,transparent 48% 52%,#000 52% 60%,transparent 60% 65%,#000 65% 71%,transparent 71% 77%,#000 77% 82%,transparent 82% 89%,#000 89% 92%,transparent 92%);
          mask:linear-gradient(180deg,#000 0 48%,transparent 48% 52%,#000 52% 60%,transparent 60% 65%,#000 65% 71%,transparent 71% 77%,#000 77% 82%,transparent 82% 89%,#000 89% 92%,transparent 92%);
  filter:drop-shadow(0 0 40px rgba(255,79,176,.45))}
.floor{position:absolute;left:-50%;right:-50%;top:70%;bottom:0;perspective:280px;overflow:hidden}
.grid{position:absolute;left:0;right:0;top:0;height:200%;transform-origin:50% 0;transform:rotateX(72deg);
  background-image:
    linear-gradient(90deg,rgba(255,79,176,.9) 2px,transparent 2px),
    linear-gradient(0deg,rgba(255,79,176,.9) 2px,transparent 2px);
  background-size:64px 64px;background-position:center 0;
  animation:none}
@keyframes roll{to{background-position:center 64px}}
.floor::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#14062a 0%,rgba(20,6,42,.2) 30%,transparent 60%)}
.horizon{position:absolute;left:0;right:0;top:70%;height:2px;background:var(--hot);box-shadow:0 0 18px 3px rgba(255,79,176,.7)}

/* ---------- page ---------- */
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:clamp(18px,4vw,40px) 18px 56px;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{margin:4px 0 -6px;line-height:0}
.logo img{display:block;width:min(432px,78vw);height:auto;image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 0 18px rgba(255,79,176,.35))}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px}
.plat{font:400 clamp(10px,2.2vw,13px)/1.2 "Press Start 2P",var(--px);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-shadow:2px 2px 0 #7a3a10,0 0 14px rgba(255,210,63,.35)}
.eyebrow{margin:0;text-wrap:balance;font:400 13px/1.5 var(--px);letter-spacing:.14em;color:var(--cyan);text-transform:uppercase;text-align:center;
  padding:6px 12px;background:rgba(10,4,32,.88);border:1px solid #2f8fb0;box-shadow:0 0 0 2px #0a0420}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* GBA-screen frame, like the game's neon panels */
.screen{width:100%;max-width:720px;padding:8px;background:var(--panel);border:2px solid var(--cyan);
  box-shadow:0 0 0 2px #0a0420,0 0 22px rgba(79,224,255,.35),inset 0 0 0 2px #0a0420}
.screen img{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges}
.screen video{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#000}

/* the one button: a title-menu row under the cursor */
.row{position:relative;width:100%;max-width:560px;display:flex;justify-content:center}
.arrow{position:absolute;left:-26px;top:50%;width:16px;height:22px;margin-top:-11px;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateX(5px)}}
.dl{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px 14px 14px;text-decoration:none;color:var(--white);
  background:linear-gradient(180deg,#3a1450,#2a0f46);border:3px solid var(--pink);
  box-shadow:0 0 0 2px #0a0420,0 0 18px rgba(255,79,176,.55),inset 0 0 14px rgba(255,79,176,.25);
  transition:transform .08s}
@keyframes pulse{50%{box-shadow:0 0 0 2px #0a0420,0 0 30px rgba(255,79,176,.85),inset 0 0 20px rgba(255,79,176,.4);border-color:var(--hot)}}
.dl:hover{transform:translateY(-2px)}
.dl:active{transform:translateY(1px);background:#4a1a62}
.dl:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.ico{flex:none;width:52px;height:52px;display:grid;place-items:center;background:#fff4fb;border:2px solid #0a0420;box-shadow:0 0 0 2px var(--pink)}
.ico svg{width:36px;height:36px;shape-rendering:crispEdges}
@keyframes drop{50%{transform:translateY(3px)}}
.txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.txt b{font:400 clamp(22px,5vw,30px)/1 var(--px);letter-spacing:.06em;text-transform:uppercase;color:#fff;
  text-shadow:2px 2px 0 #7a1466;-webkit-font-smoothing:none;font-smooth:never}
.txt small{font:500 15px/1.2 var(--body);color:var(--lav);letter-spacing:.02em}


.info{width:100%;max-width:800px;margin-top:8px;padding:20px clamp(12px,2vw,16px) 18px;display:flex;flex-direction:column;align-items:center;gap:18px;
  background:rgba(23,10,48,.94);border:2px solid #2f8fb0;box-shadow:0 0 0 2px #0a0420,0 0 16px rgba(79,224,255,.18)}
.about{max-width:560px;text-align:center;color:#d6cbf5;font-size:17px;font-weight:500;line-height:1.55;margin:4px 0 0;text-shadow:0 1px 8px #0a0420}
.about{text-wrap:pretty}
.nw{white-space:nowrap}
.about strong{color:var(--white);font-weight:600}

/* screenshots at exactly 1x (240x160) so the pixel text stays crisp; 2x-or-less screens fall back to fluid */
.shots{display:grid;grid-template-columns:repeat(3,254px);justify-content:center;gap:12px;width:100%}
.shots figure{margin:0;padding:5px;background:var(--panel);border:2px solid #3b2a6a;box-shadow:0 0 0 2px #0a0420}
.shots img{display:block;width:100%;height:auto;object-fit:contain;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges}
.shots figcaption{font:400 11px/1 var(--px);color:var(--cyan);letter-spacing:.08em;text-transform:uppercase;padding:7px 2px 2px}

.foot{font:500 15px/1.6 var(--body);color:#a493d4;text-align:center;max-width:620px;margin:0}
.foot b{color:var(--lav);font-weight:600}

.pocket{display:flex;flex-direction:column;align-items:center;gap:14px;margin:4px 0 6px}
.pocket .dev{position:relative;width:min(470px,76vw)}
.pocket video{position:absolute;left:11.945%;top:11.872%;width:76.11%;height:30.151%;object-fit:cover;background:#000}
.pocket img{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(79,224,255,.12))}
.snd{position:absolute;right:11.945%;top:42.7%;height:4.1%;aspect-ratio:5/4;width:auto;display:grid;place-items:center;padding:0;border:1px solid rgba(79,224,255,.6);
  background:rgba(10,4,32,.78);color:var(--cyan);cursor:pointer}
.snd svg{width:62%;height:62%}.snd .w{display:none}.snd[aria-pressed="true"] .w{display:inline}.snd[aria-pressed="true"] .x{display:none}
.snd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pocket p{margin:0;font:400 13px/1.2 var(--px);color:var(--cyan);letter-spacing:.12em;text-transform:uppercase;text-align:center;
  padding:6px 12px;background:rgba(10,4,32,.88);border:1px solid #2f8fb0;box-shadow:0 0 0 2px #0a0420}
@media (max-width:860px){ .shots{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:560px){
  .pocket p .nw{display:block} .pocket p .dot{display:none}
  .eyebrow{font-size:11px;letter-spacing:.08em;padding:7px 12px}
  .eyebrow .nw{display:block}
  .shots{grid-template-columns:minmax(0,320px);justify-content:center}
  .arrow{display:none}
  .sun{width:78vw;right:-14vw;top:36%}
  .ico{width:44px;height:44px}.ico svg{width:30px;height:30px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="stars"></div><div class="stars b"></div>
  <div class="sun"></div>
  <div class="floor"><div class="grid"></div></div>
  <div class="horizon"></div>
</div>

<main>
  <h1 class="logo"><img src="img/triiv-logo.png?v=1" width="108" height="33" alt="TRiiV"><span class="plat">for Game Boy Advance</span></h1>
  <p class="eyebrow"><span class="nw">Zero gravity. No brakes.</span> <span class="nw">Every shot drains your shield.</span></p>

  <div class="row">
    <a class="dl" id="dl" href="https://github.com/zartorialist/triiv/releases/latest/download/Triiv.gba" rel="noopener">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 12 12"><path fill="#ff4fb0" d="M5 1h2v5h2v1H8v1H7v1H5V8H4V7H3V6h2z"/><path fill="#24114a" d="M2 10h8v1H2z"/></svg>
      </span>
      <span class="txt"><b>Download ROM</b><small id="build">Free · 13 MB · updated Nov 13</small></span>
    </a>
  </div>
  <section class="pocket hero">
    <div class="dev"><img src="img/pocket-screen.png?v=1" width="946" height="1592" alt="An Analogue Pocket playing the TRiiV trailer"><video src="img/trailer.mp4?v=12" poster="img/splash.gif?v=4" autoplay muted loop playsinline preload="auto" aria-label="TRiiV trailer"></video><button class="snd" id="snd" type="button" aria-label="Turn the sound on" aria-pressed="false"><svg viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M1 4h2l3-3h1v10H6L3 8H1z"/><path class="w" fill="currentColor" d="M8 4h1v4H8zM10 2h1v8h-1z"/><path class="x" fill="currentColor" d="M8 4h1v1H8zM10 4h1v1h-1zM9 5h1v2H9zM8 7h1v1H8zM10 7h1v1h-1z"/></svg></button></div>
    <p><span class="nw">Tested on the Analogue Pocket</span><span class="dot"> · </span><span class="nw">Runs on any GBA emulator</span></p>
  </section>



</main>

<script>
/* keep the build date and size current: ask GitHub for the latest release (works on the public site; the text above is the fallback) */
(async()=>{try{
  const r=await fetch('https://api.github.com/repos/zartorialist/triiv/releases/latest'); if(!r.ok) return;
  const j=await r.json(), a=(j.assets||[]).find(x=>/\.gba$/i.test(x.name)); if(!a) return;
  const d=new Date(j.published_at||a.updated_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('build').textContent='Free · '+Math.round(a.size/1e6)+' MB · updated '+d;
}catch(e){}})();
</script>
<script>
(()=>{const v=document.querySelector('.pocket video'),b=document.getElementById('snd'); if(!v||!b) return;
 const set=on=>{v.muted=!on; b.setAttribute('aria-pressed',String(on)); b.setAttribute('aria-label',on?'Turn the sound off':'Turn the sound on'); if(on){ v.play().catch(()=>{}); }};
 b.addEventListener('click',()=>set(v.muted)); v.addEventListener('click',()=>set(v.muted));})();
</script>
</body>
</html>
